name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Fail fast: detect issues early
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Ensure per-package deps for grpc-client
        run: |
          # Install per-package dependencies for packages that run tsc directly
          pnpm --filter @chirp/grpc-client install --frozen-lockfile

      - name: Check for vulnerabilities (npm audit)
        run: pnpm audit --audit-level=moderate || true

  # Lint: catch style and formatting issues
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

  # Type checking: catch type errors early
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Run type checker
        run: pnpm run typecheck

      - name: Generate proto
        run: |
          cd packages/proto
          pnpm install --frozen-lockfile
          pnpm run proto:generate

      - name: Prebuild proto package
        run: |
          # Build the proto package early so its compiled `dist` (types) are available for dependent packages
          pnpm --filter @chirp/proto run build

      - name: Ensure per-package deps for grpc-client
        run: |
          # Install per-package dependencies for packages that run tsc directly
          pnpm --filter @chirp/grpc-client install --frozen-lockfile

      - name: Generate DB
        run: |
          # Ensure @chirp/api devDependencies are installed so pnpm can resolve drizzle-kit
          pnpm --filter @chirp/api install --frozen-lockfile
          # Quick diagnostics to help CI debugging (non-fatal)
          pnpm --filter @chirp/api exec -- which drizzle-kit || true
          pnpm --filter @chirp/api exec -- drizzle-kit generate

  # Unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

  # Build: verify all packages build successfully
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Generate proto
        run: |
          cd packages/proto
          pnpm install --frozen-lockfile
          pnpm run proto:generate

      - name: Setup database
        run: |
          # Ensure @chirp/api devDependencies are installed so pnpm can resolve drizzle-kit
          pnpm --filter @chirp/api install --frozen-lockfile
          pnpm --filter @chirp/api exec -- which drizzle-kit || true
          pnpm run db:generate && pnpm run db:migrate

      - name: Run build
        run: pnpm run build

  # E2E tests (only on PRs and main branch, optional for now due to hydration issues)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate proto
        run: |
          # Ensure proto package devDependencies are present, then run protoc
          cd interviewQuestions/llm-web-refactoring-test-gogogo1024/packages/proto
          pnpm install --frozen-lockfile
          pnpm exec protoc --plugin=protoc-gen-ts=./node_modules/.bin/protoc-gen-ts --ts_out=./generated --proto_path=./protos ./protos/*.proto

      - name: Setup database
        run: pnpm run db:generate && pnpm run db:migrate && pnpm run db:seed

      - name: Run E2E tests
        run: pnpm run test:e2e
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 7
