name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interviewQuestions/llm-web-refactoring-test-gogogo1024
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile


      - name: Lint (all)
        run: pnpm -w turbo run lint

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate proto
        run: pnpm run proto:generate

      - name: Generate DB
        run: pnpm --filter @chirp/api run db:generate

      - name: Build (all)
        run: pnpm -w turbo run build

      - name: Typecheck (all)
        run: pnpm -w turbo run typecheck

      - name: Unit tests (all)
        run: pnpm -w turbo run test:unit

      - name: E2E (full)
        run: pnpm run test:e2e
