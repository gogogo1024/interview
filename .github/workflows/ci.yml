name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interviewQuestions/llm-web-refactoring-test-gogogo1024
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile


      - name: Lint (all)
        run: pnpm -w -r run lint

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate proto
        run: |
          # Ensure proto package devDependencies are present, then run protoc
          pnpm --filter @chirp/proto install --frozen-lockfile
          cd packages/proto
          pnpm exec protoc --plugin=protoc-gen-ts=./node_modules/.bin/protoc-gen-ts --ts_out=./generated --proto_path=./protos ./protos/*.proto

      - name: Generate DB
        run: |
          # Ensure @chirp/api devDependencies are installed so pnpm can resolve drizzle-kit
          pnpm --filter @chirp/api install --frozen-lockfile
          # Quick diagnostics to help CI debugging (non-fatal)
          pnpm --filter @chirp/api exec -- which drizzle-kit || true
          pnpm --filter @chirp/api exec -- drizzle-kit generate

      - name: Pre-build diagnostics
        run: |
          echo "Diagnose vite availability for @chirp/client-admin"
          pnpm --filter @chirp/client-admin exec -- which vite || true
          echo "List apps/client-admin and its node_modules"
          ls -la apps/client-admin || true
          ls -la apps/client-admin/node_modules || true
          echo "List root node_modules/.bin"
          ls -la node_modules/.bin || true
          echo "Attempt per-package install (non-fatal) to ensure package binaries are present"
          pnpm --filter @chirp/client-admin install --frozen-lockfile || true
          pnpm --filter @chirp/client-admin exec -- which vite || true

      - name: Build (all)
        run: pnpm -w -r run build

      - name: Typecheck (all)
        run: pnpm -w -r run typecheck

      - name: Unit tests (all)
        run: pnpm -w -r run test:unit

      - name: E2E (full)
        run: pnpm run test:e2e
