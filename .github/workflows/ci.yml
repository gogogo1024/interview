name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ master ]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interviewQuestions/llm-web-refactoring-test-gogogo1024
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install protoc (for proto code generation)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        run: pnpm install -w --frozen-lockfile

      - name: Generate proto definitions (protoc)
        run: |
          cd packages/proto
          pnpm install --frozen-lockfile
          pnpm exec protoc --plugin=protoc-gen-ts=./node_modules/.bin/protoc-gen-ts --ts_out=./generated --proto_path=./protos ./protos/*.proto

      - name: Build proto package (generate types for dependents)
        run: |
          cd packages/proto
          pnpm run build

      - name: Clear turbo cache before typecheck
        run: rm -rf .turbo

      - name: Generate database migrations
        run: pnpm --filter @chirp/api exec drizzle-kit generate

      - name: Lint (fast feedback)
        run: pnpm -w -r run lint

      - name: Typecheck (fast feedback)
        run: pnpm -w -r run typecheck --no-cache

      - name: Build (all packages)
        run: pnpm -w -r run build

      - name: Unit tests
        run: pnpm -w -r run test:unit

      - name: E2E tests (optional - may timeout in CI)
        run: pnpm run test:e2e
        continue-on-error: true
        timeout-minutes: 10
